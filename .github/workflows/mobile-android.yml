# Builds the TicketJunkies Android app in the cloud — no Android Studio needed.
# GitHub → Actions → "Mobile app – Android" → Run workflow. Download the result under "Artifacts".
#  - ticketjunkies-android-test.apk : install straight on an Android phone to try it
#  - ticketjunkies-play-store.aab   : upload to Google Play Console (signed when the 4 secrets below are set)
# Secrets (Settings → Secrets and variables → Actions): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Mobile app – Android
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version shown in the store (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
  push:
    tags: ['app-v*']
    branches: ['main', 'master']
    paths: ['mobile-app/**', '.github/workflows/mobile-android.yml']
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile-app } }
    env:
      APP_VERSION: ${{ github.event.inputs.version || '1.0.0' }}
      APP_BUILD: ${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '21' }
      # GitHub's Ubuntu machines already include the Android SDK (ANDROID_HOME)
      - name: Create the Android project
        run: |
          npm install
          npx cap add android
          node scripts/native-setup.mjs
          npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#12161f' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#12161f'
          npx cap sync android
      - name: Build
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon
      - name: Sign the Play Store bundle
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > upload.jks
          jarsigner -keystore upload.jks -storepass "$KS_PASS" -keypass "$KEY_PASS" android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          rm upload.jks
      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/ticketjunkies-android-test.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/ticketjunkies-play-store.aab
      - uses: actions/upload-artifact@v4
        with:
          name: ticketjunkies-android-${{ env.APP_VERSION }}-build${{ github.run_number }}
          path: mobile-app/out/*
