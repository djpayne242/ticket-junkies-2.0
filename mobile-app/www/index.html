<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TicketJunkies</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,sans-serif;background:#fff;color:#1b1f2a;text-align:center}
.icon{width:120px;height:120px;animation:pop 1.2s ease-in-out infinite alternate}.logo{display:block;width:240px;height:auto;margin:18px auto 0}

<body><div><img class="icon" src="icon.png" alt=""><img class="logo" src="logo.png" alt="TicketJunkies"></div>
<script>location.replace('https://ticketjunkies.com/?source=app');</script></body></html>
